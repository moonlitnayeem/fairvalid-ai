name: Publish FairValid to MCP Registry

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fairvalid-mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'moonlitnayeem/fairvalid-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check the FairValid remote-only manifest
        run: |
          set -euo pipefail
          jq --exit-status '
            .name == "io.github.moonlitnayeem/fairvalid" and
            .repository.url == "https://github.com/moonlitnayeem/fairvalid-ai" and
            .remotes == [{"type": "streamable-http", "url": "https://mcp.fairvalid.com/mcp"}] and
            ((.packages // []) | length == 0)
          ' server.json

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Download and verify the pinned MCP publisher
        run: |
          set -euo pipefail
          publisher_dir="${RUNNER_TEMP}/fairvalid-mcp-publisher"
          mkdir -p "$publisher_dir"
          cd "$publisher_dir"
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate with the repository GitHub identity
        run: '"${RUNNER_TEMP}/fairvalid-mcp-publisher/mcp-publisher" login github-oidc'

      - name: Publish the remote FairValid server
        run: '"${RUNNER_TEMP}/fairvalid-mcp-publisher/mcp-publisher" publish'
